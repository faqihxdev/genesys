version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Security updates have a separate limit and run when GitHub detects an advisory.
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # SHA-pinned actions need version updates because advisory alerts require semver tags.
    open-pull-requests-limit: 1
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - '*'
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
